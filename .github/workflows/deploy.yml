name: Deploy

on:
  push:
    branches: ['main']

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/deploy.yml'

  backend-deploy:
    name: Backend deploy
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - run: npx serverless deploy --stage prod
        env:
          SPEECHMATICS_API_KEY: ${{ secrets.SPEECHMATICS_API_KEY }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

  frontend-deploy:
    name: Frontend deploy
    needs: [changes, backend-deploy]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.backend-deploy.result == 'success' || needs.backend-deploy.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - name: Read backend stack outputs
        id: stack
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name vocali-transcriber-api-prod \
            --query 'Stacks[0].Outputs' --output json)
          echo "api_url=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ApiUrl").OutputValue')" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="UserPoolId").OutputValue')" >> "$GITHUB_OUTPUT"
          echo "client_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="UserPoolClientId").OutputValue')" >> "$GITHUB_OUTPUT"
          echo "bucket=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="FrontendBucketName").OutputValue')" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="FrontendDistributionId").OutputValue')" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ steps.stack.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.stack.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.stack.outputs.client_id }}
      - run: aws s3 sync dist/ "s3://${{ steps.stack.outputs.bucket }}" --delete
      - run: aws cloudfront create-invalidation --distribution-id "${{ steps.stack.outputs.distribution_id }}" --paths "/*"
